<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Press Start 2P, served from public/fonts rather than Google Fonts: two
         subsets totalling 8KB, so it arrives with the page instead of after a
         third-party DNS lookup, connection and fetch. Licence in the same
         directory (OFL, which requires it travel with the font).

         Declared here rather than in index.css, and preloaded, so the HTML
         preloader starts the fetch at once - an @font-face in a stylesheet is
         only discovered after that stylesheet is fetched and parsed, which
         under Vite means after the JS that imports it.

         font-display: block, not swap. Nothing here should render in a
         fallback face and reflow when the real one lands: it looked wrong for
         a moment, and Safari does not reliably re-lay-out an auto-height
         container when that reflow arrives late, so modals could keep a size
         measured against the wrong font. Same-origin and preloaded, the block
         period is imperceptible. -->
    <link
      rel="preload"
      href="/fonts/press-start-2p-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/press-start-2p-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/press-start-2p-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <title>ReDPaint</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
